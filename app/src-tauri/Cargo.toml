[package]
name = "shiftwork-app"
version = "0.1.0"
description = "ShiftWork — Agent orchestration terminal"
authors = ["reasoning.software"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shiftwork_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "shiftwork-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
